server {
    listen 4173;
    listen [::]:4173;
    server_name _;

    root /opt/phishguard/Loki/dist;
    index index.html;

    # API isteklerini backend'e yönlendir
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Login gibi stresse.st'e bagli uzun islemler icin timeout'lari artir
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Hashed asset'ler (JS/CSS) - 1 yıl cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html asla cache'lenmesin
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Diğer tüm istekler index.html'e düşsün (SPA)
    location / {
        try_files $uri $uri/ /index.html;

        # HTML dosyaları için kısa cache / no-cache
        if ($uri ~* \.html$) {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
